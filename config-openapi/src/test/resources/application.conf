basic-test = {
  remote-services = [
    {
      service-id = "test-service"
      base-url = "http://localhost:4567"
      open-api = {
        type = "remote-path"
        remote-path = "/swagger"
        auth = {
          type = "basic"
          userId = "test-auth"
          password = "auth-password"
        }
      }
    }
    {
      service-id = "other-service"
      base-url = "http://localhost:4567/other-service"
    }
  ]
}

wrong-openapi-type = {
  remote-services = [
    {
      service-id = "test-service"
      open-api = {
        type = "unrecognized"
      }
    }
  ]
}

resource-fetcher = {
  remote-services = [
    {
      service-id = "test-service"
      open-api = {
        type = "resource-path"
        resource-path = "/openapi/test-service.yml"
      }
    }
  ]
}

remote-url-fetcher = {
  remote-services = [
    {
      service-id = "test-service"
      open-api = {
        type = "remote-url"
        remote-url = "https://openapi.test/definition"
        auth = {
          type = "basic"
          userId = "test-auth"
          password = "auth-password"
        }
      }
    }
  ]
}
